# --- Plugins ---------------
set -g @plugin 'tmux-plugins/tpm'

set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
# TODO: vim-tmux-navigation


# --- General ---------------

set-option -a terminal-features 'xterm-256color:RGB'  # recommended by neovim
set-option -s terminal-overrides ',xterm*:Tc'  # fix colors in tmux sessions

set  -g base-index 1 			# start windows numbering at 1
setw -g pane-base-index 1 		# make pane numbering consistent with windows
set  -g renumber-windows on 	# renumber windows when a window is closed

set-option -g allow-rename off 	# don't rename windows automatically

set -g mouse on 				# enable mouse control (clickable windows, panes, resizable panes)


# --- Bindings --------------

# Remap prefix from 'C-b' to 'C-Space'
unbind C-b
set-option -g prefix C-Space
bind-key C-Space send-prefix

# Set vim-bindings
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi v   send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y   send-keys -X copy-selection-and-cancel

# Spawn popup
unbind t  # display time
bind t display-popup
bind C-p display-popup -E python3  # Or ipython

# Split on [h] and [v]
# And in the current directory
# TODO: this is inverted compared to neovim (vsplit)
bind h split-window -h -c "#{pane_current_path}"
bind v split-window -v -c "#{pane_current_path}"

# [r] Reload config file
bind r source-file ~/.config/tmux/tmux.conf


# --- Statusbar -------------

# TODO: colors?
set -g status-justify left
set -g status-left '#[bold]#S#[nobold] |  '
set -g status-left-length 40
set -g status-position top
set -g status-right '%H:%M %d-%m-%Y'
set -g status-right-length 20
set -g status-style 'fg=colour3'
set -g window-status-current-format "#[bold,underscore]#I:#W#{?window_flags,#{window_flags}, }#[nobold,nounderscore] "
# TODO: remove last/current with 
# `set-window-option -g window-status-format "  #{s/-/>>/:window_flags} #I #W"`
set -g window-status-format "#I:#W#{?window_flags,#{window_flags}, } "
# TODO: set -g message-style "..."
# TODO: set -g mode-style "..."
# TODO: set -g pane-border-style "..."
# TODO: set -g pane-active-border-style "..."


# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
